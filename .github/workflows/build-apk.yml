name: Build & Verify Sudoku Master Trainer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Verification Tests & Build Signed Release APK
        run: gradle test assembleRelease --stacktrace

      - name: Prepare Signed APK Artifact
        run: cp app/build/outputs/apk/release/app-release.apk SudokuMasterTrainer.apk

      - name: Upload SudokuMasterTrainer.apk Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMasterTrainer-apk
          path: SudokuMasterTrainer.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" SudokuMasterTrainer.apk \
            --title "Sudoku Master Trainer $TAG" \
            --notes "Automated signed release build of Sudoku Master Trainer (commit ${{ github.sha }})." \
            --latest
