name: Distribute to Family via Firebase

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      distribution_flavor:
        description: 'Release artifact flavor (directApk for standalone APK, playBundle for Google Play AAB)'
        required: true
        default: 'directApk'
        type: choice
        options:
          - directApk
          - playBundle
      release_notes:
        description: 'Release notes for family testers'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDirectApkDebugUnitTest --no-daemon

      - name: Compute Release Version
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Decode google-services.json if provided
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            (
              umask 077
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            )
          fi

      - name: Decode Release Keystore if provided
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            (
              umask 077
              echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
            )
            echo "ANDROID_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"
          fi

      - name: Select Distribution Flavor
        id: flavor
        env:
          INPUT_FLAVOR: ${{ github.event.inputs.distribution_flavor }}
        run: |
          SELECTED="${INPUT_FLAVOR:-directApk}"
          echo "flavor=$SELECTED" >> "$GITHUB_OUTPUT"
          if [ "$SELECTED" = "playBundle" ]; then
            echo "artifact_path=app/build/outputs/bundle/playBundleRelease/app-playBundle-release.aab" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_path=app/build/outputs/apk/directApk/release/app-directApk-release.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Play Bundle (.aab)
        if: steps.flavor.outputs.flavor == 'playBundle'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayBundleRelease --no-daemon

      - name: Build Signed Direct APK (.apk)
        if: steps.flavor.outputs.flavor == 'directApk'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDirectApkRelease --no-daemon

      - name: Upload Release Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-master-trainer-${{ steps.flavor.outputs.flavor }}-release
          path: ${{ steps.flavor.outputs.artifact_path }}

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          ARTIFACT_PATH: ${{ steps.flavor.outputs.artifact_path }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_CREDENTIAL_FILE_CONTENT" ]; then
            echo "Firebase distribution secrets not configured; skipping upload."
            exit 0
          fi
          NOTES="${INPUT_RELEASE_NOTES:-Sudoku Master Trainer ${VERSION_NAME} (${GITHUB_SHA:0:7})}"
          SA_FILE="${RUNNER_TEMP}/firebase-sa.json"
          (
            umask 077
            printf '%s' "$FIREBASE_CREDENTIAL_FILE_CONTENT" > "$SA_FILE"
          )
          GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE" npx --yes firebase-tools@15.37.0 appdistribution:distribute "$ARTIFACT_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups family \
            --release-notes "$NOTES"

      - name: Scrub Sensitive Build Files
        if: always()
        run: rm -f release.jks app/google-services.json "${RUNNER_TEMP}/firebase-sa.json"
